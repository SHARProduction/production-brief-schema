name: Validate production tools
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test production-brief/tests/*.test.mjs production-dataset/tests/*.test.mjs public-mcp-examples/test.mjs
      - run: node brief-browser/build.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r production-dataset/requirements-test.txt
      - run: python production-dataset/tests/load_huggingface.py
        env:
          HF_HUB_OFFLINE: '1'
          HF_DATASETS_OFFLINE: '1'
